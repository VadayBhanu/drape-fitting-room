<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape try-on</title>
<style>
  :root { --bg:#1d0f1e; --bg2:#2a1530; --ink:#f6efe8; --muted:#c9a9c4; --acc:#e9cf93; --rose:#db2777; --vio:#7c3aed; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #app { max-width:460px; height:100%; margin:0 auto; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.08); }
  header img { width:52px; height:52px; object-fit:cover; border-radius:12px; background:var(--bg2); flex:none; }
  header .nm { font-weight:700; font-size:15px; margin:0; }
  header .pr { color:var(--acc); font-size:14px; margin:2px 0 0; }
  #closeBtn { margin-left:auto; width:32px; height:32px; border-radius:50%; border:0; flex:none;
    background:rgba(255,255,255,.1); color:#fff; font-size:17px; cursor:pointer; }
  #stage { flex:1; overflow-y:auto; padding:18px 16px 12px; display:flex; flex-direction:column; gap:14px; }
  .drop { border:2px dashed rgba(233,207,147,.45); border-radius:18px; padding:34px 18px; text-align:center;
    background:var(--bg2); cursor:pointer; }
  .drop:hover { border-color:var(--acc); }
  .drop p { margin:8px 0 0; color:var(--muted); font-size:14px; }
  .drop strong { font-size:16px; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin:0; }
  #preview { width:100%; border-radius:16px; display:block; background:#000; }
  .status { text-align:center; color:var(--acc); font-size:15px; min-height:24px; }
  .spin { width:34px; height:34px; margin:6px auto; border-radius:50%;
    border:3px solid rgba(255,255,255,.15); border-top-color:var(--acc); animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .ba { position:relative; border-radius:16px; overflow:hidden; background:#000; user-select:none; }
  .ba img { display:block; width:100%; }
  .ba .top { position:absolute; inset:0; overflow:hidden; border-right:2px solid #fff; }
  .ba .top img { width:100%; height:100%; object-fit:cover; }
  .ba .tag { position:absolute; top:10px; font-size:11px; font-weight:700; letter-spacing:.08em;
    background:rgba(0,0,0,.55); padding:4px 10px; border-radius:999px; }
  .ba .tag.b { left:10px; } .ba .tag.a { right:10px; }
  input[type=range].slider { width:100%; accent-color:var(--acc); margin:2px 0 0; }
  .row { display:flex; gap:10px; }
  .btn { flex:1; border:0; border-radius:999px; padding:13px 18px; font-weight:700; font-size:15px; cursor:pointer; }
  .btn.primary { color:#fff; background:linear-gradient(135deg,var(--vio),var(--rose)); }
  .btn.ghost { color:var(--ink); background:rgba(255,255,255,.1); }
  .btn:disabled { opacity:.5; cursor:default; }
  .err { background:rgba(219,39,119,.14); border:1px solid rgba(219,39,119,.5); border-radius:14px;
    padding:14px; font-size:14px; }
  details.set { border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px 14px; font-size:13px; color:var(--muted); }
  details.set summary { cursor:pointer; color:var(--ink); font-weight:600; }
  details.set input { width:100%; margin-top:8px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.3); color:var(--ink); font-size:14px; }
  footer { padding:12px 16px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.08);
    display:flex; gap:10px; }
  footer .btn { text-decoration:none; text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="pThumb" alt="" referrerpolicy="no-referrer">
    <div><p class="nm" id="pName"></p><p class="pr" id="pPrice"></p></div>
    <button id="closeBtn" aria-label="Close try-on">&#215;</button>
  </header>

  <div id="stage">
    <!-- pick a photo -->
    <div id="pickState">
      <label class="drop" id="dropZone">
        <strong>Upload your photo</strong>
        <p>Tap to choose a photo, or drop one here.<br>A front-facing photo, head to feet, works best.</p>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </label>
      <p class="hint">Your photo is sent to the try-on service only when you press Try it on.</p>
    </div>

    <!-- working -->
    <div id="workState" hidden>
      <img id="preview" alt="Your photo">
      <div class="spin"></div>
      <p class="status" id="statusText">Starting…</p>
    </div>

    <!-- result -->
    <div id="doneState" hidden>
      <div class="ba" id="baWrap">
        <img id="afterImg" alt="You wearing it">
        <div class="top" id="beforeWrap"><img id="beforeImg" alt="Your photo"></div>
        <span class="tag b">BEFORE</span><span class="tag a">AFTER</span>
      </div>
      <input type="range" class="slider" id="baSlider" min="0" max="100" value="50" aria-label="Compare before and after">
      <div class="row">
        <button class="btn ghost" id="againBtn">New photo</button>
        <button class="btn ghost" id="saveBtn">Save image</button>
      </div>
    </div>

    <div id="errState" class="err" hidden>
      <p id="errText" style="margin:0 0 10px"></p>
      <button class="btn ghost" id="retryBtn" style="width:100%">Try another photo</button>
    </div>

    <details class="set" id="setBox">
      <summary>Real fit settings</summary>
      <p style="margin:8px 0 0">Add a Hugging Face token to raise the free daily limit. It stays in this browser.</p>
      <input type="password" id="tokenInput" placeholder="hf_…" autocomplete="off">
    </details>
  </div>

  <footer>
    <button class="btn primary" id="goBtn" disabled>Try it on</button>
    <a class="btn primary" id="buyBtn" href="#" target="_top" hidden>Buy now</a>
  </footer>
</div>

<script type="module" src="embed.js"></script>
</body>
</html>
